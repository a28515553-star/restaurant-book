name: Build Salah Focus APK

on:
  push:
    paths:
      - "salah-focus/**"
      - ".github/workflows/build-salah-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salah-focus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk salah-focus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: salah-focus-apk
          path: salah-focus/salah-focus.apk

      - name: Commit APK to the branch
        if: github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          mkdir -p dist
          cp salah-focus/salah-focus.apk dist/salah-focus.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/salah-focus.apk
          git commit -m "build: salah-focus.apk [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish to release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete salah-focus-latest --yes --cleanup-tag || true
          gh release create salah-focus-latest salah-focus.apk \
            --title "وقت الصلاة - آخر نسخة" \
            --notes "نزّل ملف salah-focus.apk على الجوال وثبّته."
