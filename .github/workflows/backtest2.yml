name: Backtest strategies (RSI2, Donchian)

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - signal-bot/backtest2.py
      - .github/workflows/backtest2.yml

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r signal-bot/requirements.txt
      - name: Run backtest on real Binance data
        working-directory: signal-bot
        run: python backtest2.py
