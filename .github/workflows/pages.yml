name: Deploy web apps to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['crypto-scanner/**', 'flight-search/**', 'image-reviewers/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Test analysis engine
        run: node crypto-scanner/test.js
      - name: Test flight links
        run: node flight-search/test.js
      - name: Test image reviewers
        run: node image-reviewers/test.js
      # ماسح بينانس على الجذر (نفس الرابط القديم)، ومقارن الطيران على /flights/، ولجنة تدقيق الصور على /reviewers/
      - name: Assemble site
        run: |
          mkdir -p _site/flights _site/reviewers
          cp -r crypto-scanner/. _site/
          cp -r flight-search/. _site/flights/
          cp -r image-reviewers/. _site/reviewers/
          rm -f _site/test.js _site/flights/test.js _site/reviewers/test.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
