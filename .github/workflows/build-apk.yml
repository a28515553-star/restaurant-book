name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk restaurant-book.apk

      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-book-apk
          path: restaurant-book.apk

      # A fixed "latest" release gives a stable download link that opens straight on the phone.
      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest restaurant-book.apk \
            --title "دفتر المطعم - آخر نسخة" \
            --notes "نزّل ملف restaurant-book.apk على الجوال وثبّته."
