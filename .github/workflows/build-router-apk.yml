name: Build Router Manager APK

on:
  push:
    branches: [main, ccr-ed5392ba-o51m1s]
    paths: [router-manager/**, .github/workflows/build-router-apk.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: router-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: router-manager-apk
          path: router-manager/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to router-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk router-manager.apk
          gh release delete router-latest --yes --cleanup-tag || true
          gh release create router-latest router-manager.apk \
            --title "مدير الراوترات - آخر نسخة" \
            --notes "نزّل ملف router-manager.apk على الجوال وثبّته."
