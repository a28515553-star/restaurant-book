<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماسح بينانس</title>
<meta name="theme-color" content="#0b0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ماسح بينانس">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#0b0e11;--panel:#161a1e;--line:#2b3139;--tx:#eaecef;--mut:#848e9c;--up:#0ecb81;--dn:#f6465d;--acc:#f0b90b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:17px;margin:0 6px 0 0;color:var(--acc)}
select,input,button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}button.pri{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
button:disabled{opacity:.5;cursor:wait}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:12px}
@media(min-width:1000px){main{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
#status{color:var(--mut);font-size:12px;padding:0 14px}
.tbl{overflow:auto;max-height:78vh}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--mut);position:sticky;top:0;background:var(--panel);font-weight:500;cursor:pointer}
tr.row{cursor:pointer}tr.row:hover,tr.sel{background:#1f252b}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700}
.BUY{background:rgba(14,203,129,.18);color:var(--up)}.WAIT{background:rgba(240,185,11,.15);color:var(--acc)}.AVOID{background:rgba(246,70,93,.18);color:var(--dn)}.EXIT{background:var(--dn);color:#fff}
#toasts{position:fixed;bottom:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:20;max-width:320px}.toast{background:var(--panel);border:1px solid var(--acc);border-radius:8px;padding:8px 12px;box-shadow:0 4px 16px #000a}.live{color:var(--up);font-size:12px}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--acc);vertical-align:middle}
canvas{width:100%;height:380px;display:block;background:#0b0e11;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.kv{background:#0b0e11;border-radius:6px;padding:8px}.kv b{display:block;font-size:15px}.kv span{color:var(--mut);font-size:12px}
ul{margin:6px 0;padding-inline-start:20px}li{margin:2px 0}
.warn li{color:var(--acc)}
.note{color:var(--mut);font-size:12px;border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
</style>
</head>
<body>
<header>
  <h1>ماسح بينانس</h1>
  <select id="tf">
    <option value="15m">15 دقيقة</option><option value="1h" selected>ساعة</option>
    <option value="4h">4 ساعات</option><option value="1d">يومي</option>
  </select>
  <label class="mut">أدنى حجم 24س (مليون$)
    <input id="minVol" type="number" value="10" min="0" style="width:70px"></label>
  <label class="mut">عدد العملات
    <input id="topN" type="number" value="60" min="10" max="150" style="width:64px"></label>
  <button id="scan" class="pri">فحص السوق</button>
  <button id="batch">باك تست شامل</button>
  <label class="mut"><input id="auto" type="checkbox"> تحديث تلقائي (5 د)</label>
  <label class="mut"><input id="alerts" type="checkbox"> تنبيهات</label>
</header>
<div id="status">اضغط «فحص السوق» لجلب أعلى العملات سيولة من بينانس.</div>
<main>
  <section class="card">
    <div class="tbl"><table id="tbl"><thead><tr>
      <th data-k="symbol">العملة</th><th data-k="price">السعر</th><th data-k="chg">24س</th>
      <th data-k="flow">السيولة</th><th data-k="relVol">حجم نسبي</th><th data-k="buy">شراء Taker</th>
      <th data-k="signal">الإشارة</th><th data-k="score">النقاط</th></tr></thead><tbody></tbody></table></div>
  </section>
  <section class="card" id="detail"><div class="mut">اختر عملة من الجدول لعرض الخطة والرسم.</div></section>
</main>
<section id="batchres" class="card" style="margin:0 12px 12px;display:none"></section>
<div id="toasts"></div>
<script>
/* محرك التحليل: مؤشرات + فوليوم بروفايل + دعوم/مقاومات + دخول السيولة + إشارة + باك تست.
   دوال نقية بدون اعتماد على المتصفح، تعمل في المتصفح وفي Node للاختبار. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Analysis = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const mean = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
  const sum = (a) => a.reduce((s, x) => s + x, 0);

  // [openTime,o,h,l,c,v,closeTime,quoteVol,trades,takerBuyBase,takerBuyQuote,_]
  function parseKlines(raw) {
    return raw.map((k) => ({
      t: k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], v: +k[5],
      qv: +k[7], n: +k[8], tbv: +k[9], tbq: +k[10],
    }));
  }

  /* ---------- مؤشرات ---------- */
  function ema(values, p) {
    const out = new Array(values.length).fill(NaN);
    if (values.length < p) return out;
    const k = 2 / (p + 1);
    let prev = mean(values.slice(0, p));
    out[p - 1] = prev;
    for (let i = p; i < values.length; i++) {
      prev = values[i] * k + prev * (1 - k);
      out[i] = prev;
    }
    return out;
  }

  // RSI بطريقة Wilder
  function rsi(c, p = 14) {
    const out = new Array(c.length).fill(NaN);
    if (c.length <= p) return out;
    let g = 0, l = 0;
    for (let i = 1; i <= p; i++) {
      const d = c[i] - c[i - 1];
      if (d >= 0) g += d; else l -= d;
    }
    g /= p; l /= p;
    out[p] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    for (let i = p + 1; i < c.length; i++) {
      const d = c[i] - c[i - 1];
      g = (g * (p - 1) + Math.max(d, 0)) / p;
      l = (l * (p - 1) + Math.max(-d, 0)) / p;
      out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    }
    return out;
  }

  // ATR بطريقة Wilder
  function atr(cs, p = 14) {
    const out = new Array(cs.length).fill(NaN);
    if (cs.length <= p) return out;
    const tr = cs.map((c, i) =>
      i === 0 ? c.h - c.l : Math.max(c.h - c.l, Math.abs(c.h - cs[i - 1].c), Math.abs(c.l - cs[i - 1].c)));
    let a = mean(tr.slice(1, p + 1));
    out[p] = a;
    for (let i = p + 1; i < cs.length; i++) {
      a = (a * (p - 1) + tr[i]) / p;
      out[i] = a;
    }
    return out;
  }

  /* ---------- احتمالات إحصائية ---------- */
  function erf(x) {
    const s = x < 0 ? -1 : 1; x = Math.abs(x);
    const t = 1 / (1 + 0.3275911 * x);
    const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return s * y;
  }
  const normCdf = (x) => 0.5 * (1 + erf(x / Math.SQRT2));

  // احتمال أن يلمس السعر المستوى خلال H شمعة (مبدأ الانعكاس، سير عشوائي بدون اتجاه)
  function touchProb(price, level, sigma, H) {
    if (!(sigma > 0) || !(H > 0)) return NaN;
    const d = Math.abs(Math.log(level / price));
    return clamp(2 * (1 - normCdf(d / (sigma * Math.sqrt(H)))), 0, 1);
  }

  function logReturnStd(cs, len = 100) {
    const s = cs.slice(-(len + 1));
    const r = [];
    for (let i = 1; i < s.length; i++) r.push(Math.log(s[i].c / s[i - 1].c));
    const m = mean(r);
    return Math.sqrt(mean(r.map((x) => (x - m) ** 2)));
  }

  /* ---------- الفوليوم بروفايل ---------- */
  function volumeProfile(cs, bins = 50) {
    const lo = Math.min(...cs.map((c) => c.l));
    const hi = Math.max(...cs.map((c) => c.h));
    const step = (hi - lo) / bins || 1e-12;
    const vol = new Array(bins).fill(0);
    for (const c of cs) {
      const i0 = clamp(Math.floor((c.l - lo) / step), 0, bins - 1);
      const i1 = clamp(Math.floor((c.h - lo) / step), 0, bins - 1);
      const share = c.v / (i1 - i0 + 1); // توزيع منتظم على نطاق الشمعة
      for (let i = i0; i <= i1; i++) vol[i] += share;
    }
    const total = sum(vol);
    let poc = 0;
    for (let i = 1; i < bins; i++) if (vol[i] > vol[poc]) poc = i;

    // منطقة القيمة 70% (طريقة TPO: توسع من POC بمقارنة زوجين من كل جهة)
    let a = poc, b = poc, acc = vol[poc];
    while (acc < total * 0.7 && (a > 0 || b < bins - 1)) {
      const up = (b < bins - 1 ? vol[b + 1] : 0) + (b + 2 < bins ? vol[b + 2] : 0);
      const dn = (a > 0 ? vol[a - 1] : 0) + (a - 2 >= 0 ? vol[a - 2] : 0);
      if (b >= bins - 1) { a--; acc += vol[a]; }
      else if (a <= 0) { b++; acc += vol[b]; }
      else if (dn > up) { a--; acc += vol[a]; }
      else { b++; acc += vol[b]; }
    }
    const centre = (i) => lo + (i + 0.5) * step;
    const avg = total / bins;
    const hvn = [], lvn = [];
    for (let i = 1; i < bins - 1; i++) {
      if (vol[i] > vol[i - 1] && vol[i] >= vol[i + 1] && vol[i] > avg * 1.3 && i !== poc) hvn.push(centre(i));
      if (vol[i] < vol[i - 1] && vol[i] <= vol[i + 1] && vol[i] < avg * 0.6) lvn.push(centre(i));
    }
    return { lo, hi, step, bins, vol, poc: centre(poc), vah: lo + (b + 1) * step, val: lo + a * step, hvn, lvn, maxVol: vol[poc] };
  }

  /* ---------- الدعوم والمقاومات ---------- */
  function swingPoints(cs, L = 4, R = 4) {
    const highs = [], lows = [];
    for (let i = L; i < cs.length - R; i++) {
      let isH = true, isL = true;
      for (let j = i - L; j <= i + R; j++) {
        if (j === i) continue;
        if (cs[j].h >= cs[i].h) isH = false;
        if (cs[j].l <= cs[i].l) isL = false;
        if (!isH && !isL) break;
      }
      if (isH) highs.push({ p: cs[i].h, i });
      if (isL) lows.push({ p: cs[i].l, i });
    }
    return { highs, lows };
  }

  function cluster(points, tol) {
    const s = [...points].sort((a, b) => a.p - b.p);
    const out = [];
    for (const pt of s) {
      const c = out[out.length - 1];
      if (c && Math.abs(pt.p - c.sum / c.n) <= tol) { c.sum += pt.p; c.n++; c.last = Math.max(c.last, pt.i); }
      else out.push({ sum: pt.p, n: 1, last: pt.i });
    }
    return out.map((c) => ({ price: c.sum / c.n, touches: c.n, last: c.last }));
  }

  function buildLevels(cs, A, vp) {
    const n = cs.length;
    const { highs, lows } = swingPoints(cs);
    const tol = 0.6 * A;
    const raw = cluster([...highs, ...lows], tol).map((l) => ({
      price: l.price, touches: l.touches, src: 'swing',
      strength: l.touches + (l.last > n - 80 ? 1 : 0),
    }));
    const vpKeys = [
      { price: vp.poc, tag: 'POC', w: 3 }, { price: vp.vah, tag: 'VAH', w: 2 }, { price: vp.val, tag: 'VAL', w: 2 },
      ...vp.hvn.map((p) => ({ price: p, tag: 'HVN', w: 1.5 })),
    ];
    for (const k of vpKeys) {
      const m = raw.find((l) => Math.abs(l.price - k.price) <= tol);
      if (m) { m.strength += k.w; m.tag = m.tag ? m.tag + '+' + k.tag : k.tag; }
      else raw.push({ price: k.price, touches: 0, src: 'vp', tag: k.tag, strength: k.w });
    }
    return raw.sort((a, b) => a.price - b.price);
  }

  /* ---------- دخول السيولة ---------- */
  // يعتمد على حجم التداول بالدولار + نسبة شراء الـ Taker (من بيانات الشموع نفسها) + تدفق الحجم الصافي
  function liquidityInflow(cs) {
    const n = cs.length;
    if (n < 40) return { score: 0, label: 'بيانات غير كافية', relVol: 0, buyRatio: 0.5, netInflow: 0, cvdUp: false, priceChg: 0 };
    const recent = cs.slice(-3), base = cs.slice(-23, -3);
    const relVol = mean(recent.map((c) => c.qv)) / (mean(base.map((c) => c.qv)) || 1);
    const w = cs.slice(-6);
    const wq = sum(w.map((c) => c.qv)) || 1;
    const buyRatio = sum(w.map((c) => c.tbq)) / wq;
    const netInflow = sum(w.map((c) => 2 * c.tbq - c.qv)); // شراء Taker - بيع Taker بالدولار
    const delta = (arr) => sum(arr.map((c) => 2 * c.tbq - c.qv));
    const cvdUp = delta(cs.slice(-12)) > 0 && delta(cs.slice(-24, -12)) <= delta(cs.slice(-12));
    const priceChg = cs[n - 1].c / cs[n - 7].c - 1;
    const rvScore = clamp((relVol - 1) / 2, 0, 1);       // 1x → 0 ، 3x فأكثر → 1
    const brScore = clamp((buyRatio - 0.5) / 0.12, 0, 1); // 50% → 0 ، 62% فأكثر → 1
    const pcScore = clamp(priceChg / 0.04, 0, 1);
    const score = Math.round(100 * (0.35 * rvScore + 0.35 * brScore + 0.15 * pcScore + 0.15 * (cvdUp ? 1 : 0)));
    let label = 'عادي';
    if (relVol >= 1.5 && buyRatio >= 0.55 && netInflow > 0) label = score >= 70 ? 'دخول سيولة قوي' : 'دخول سيولة';
    else if (relVol >= 1.3 && buyRatio >= 0.53 && Math.abs(priceChg) < 0.01) label = 'تجميع محتمل';
    else if (relVol >= 1.5 && buyRatio < 0.47) label = 'خروج سيولة / بيع';
    else if (buyRatio < 0.48) label = 'ضغط بيع';
    return { score, label, relVol, buyRatio, netInflow, cvdUp, priceChg };
  }

  /* ---------- التحليل والإشارة ---------- */
  function analyze(cs, o = {}) {
    const n = cs.length;
    if (n < 80) return null;
    const closes = cs.map((c) => c.c);
    const e50 = ema(closes, 50), e200 = n >= 200 ? ema(closes, 200) : null;
    const rs = rsi(closes), at = atr(cs);
    const A = at[n - 1], price = closes[n - 1], last = cs[n - 1], prev = cs[n - 2];
    const rsiV = rs[n - 1];
    const vp = volumeProfile(cs.slice(-(o.vpLen || 200)), 50);
    const levels = buildLevels(cs, A, vp);
    const inflow = liquidityInflow(cs);
    const sigma = logReturnStd(cs, 100);
    const H = o.horizon || 24;
    const reasons = [], warns = [];
    let score = 0;

    // 1) الاتجاه
    const trendUp = e200 ? price > e200[n - 1] : price > e50[n - 1];
    if (trendUp) { score += 15; reasons.push(e200 ? 'السعر فوق EMA200 (اتجاه صاعد)' : 'السعر فوق EMA50'); }
    else warns.push('السعر تحت المتوسط الطويل (اتجاه هابط)');
    if (e200 && e50[n - 1] > e200[n - 1]) { score += 10; reasons.push('EMA50 فوق EMA200'); }

    // 2) الموقع: ارتداد من دعم أو اختراق مقاومة
    const supports = levels.filter((l) => l.price < price && l.strength >= 2).sort((a, b) => b.price - a.price);
    const resists = levels.filter((l) => l.price > price).sort((a, b) => a.price - b.price);
    let mode = null, stopBase = null, anchor = null;

    const S = supports[0];
    if (S) {
      const touched = cs.slice(-3).some((c) => c.l <= S.price + 0.3 * A);
      const bullish = last.c > last.o && last.c > prev.c;
      if (touched && last.c > S.price && (price - S.price) <= 1.5 * A) {
        mode = 'bounce'; anchor = S; stopBase = Math.min(S.price, ...cs.slice(-3).map((c) => c.l)) - 0.5 * A;
        score += 20; reasons.push(`ارتداد من دعم ${fmt(S.price)}${S.tag ? ' (' + S.tag + ')' : ''} — قوة ${S.strength.toFixed(1)}`);
        if (bullish) { score += 10; reasons.push('شمعة تأكيد صاعدة'); }
        if (inflow.relVol >= 1.2 && inflow.buyRatio >= 0.52) { score += 8; reasons.push(`تأكيد بالحجم (${inflow.relVol.toFixed(1)}x وشراء ${(inflow.buyRatio * 100).toFixed(0)}%)`); }
        else warns.push('الارتداد بدون تأكيد حجم كافٍ');
        const body = Math.abs(last.c - last.o), lw = Math.min(last.o, last.c) - last.l;
        if (lw > body && lw > 0.3 * A) { score += 5; reasons.push('ذيل سفلي طويل (رفض للسعر الأدنى)'); }
      }
    }
    // اختراق: إغلاق فوق مقاومة خلال آخر 3 شموع وبحجم مرتفع وبدون مطاردة
    const brokeAbove = levels.filter((l) => l.strength >= 2 && closes[n - 4] < l.price && closes[n - 1] > l.price && price - l.price <= 1.5 * A)
      .sort((a, b) => b.price - a.price)[0];
    if (brokeAbove && inflow.relVol >= 1.5 && !mode) {
      mode = 'breakout'; anchor = brokeAbove; stopBase = brokeAbove.price - 0.5 * A;
      score += 25; reasons.push(`اختراق ${fmt(brokeAbove.price)}${brokeAbove.tag ? ' (' + brokeAbove.tag + ')' : ''} بحجم ${inflow.relVol.toFixed(1)}x`);
    }
    if (!mode) warns.push('لا يوجد ارتداد مؤكد من دعم ولا اختراق بحجم — انتظر');

    // 3) RSI
    if (rsiV >= 35 && rsiV <= 62) { score += 10; reasons.push(`RSI مناسب (${rsiV.toFixed(0)})`); }
    else if (rsiV > 72) warns.push(`RSI مرتفع جداً (${rsiV.toFixed(0)}) — خطر مطاردة`);
    else if (rsiV < 30) warns.push(`RSI منخفض (${rsiV.toFixed(0)}) — سكين ساقط`);

    // 4) السيولة
    score += Math.round(inflow.score * 0.2);
    if (inflow.score >= 50) reasons.push(`سيولة: ${inflow.label} (${inflow.score}/100)`);
    if (inflow.buyRatio < 0.47) warns.push('ضغط بيع من Taker');

    // الأهداف والوقف
    let plan = null;
    if (mode) {
      const entry = price;
      let stop = stopBase;
      const risk = entry - stop;
      if (risk > 0) {
        const minDist = Math.max(0.6 * A, risk * 0.8);
        const cand = resists.filter((l) => l.price >= entry + minDist);
        const targets = [];
        for (const l of cand) {
          if (targets.length >= 3) break;
          if (!targets.length || l.price - targets[targets.length - 1].price >= 0.5 * A)
            targets.push({ price: l.price, kind: 'مقاومة' + (l.tag ? ' ' + l.tag : '') });
        }
        const mult = [1.5, 2.5, 4];
        for (let k = targets.length; k < 3; k++) {
          const p = Math.max(entry + risk * mult[k], (targets[k - 1] ? targets[k - 1].price + 0.5 * A : 0));
          targets.push({ price: p, kind: `هدف ${mult[k]}R` });
        }
        targets.forEach((t) => {
          t.rr = (t.price - entry) / risk;
          t.prob = touchProb(entry, t.price, sigma, H);
          t.pct = t.price / entry - 1;
        });
        plan = {
          entry, stop, risk, riskPct: risk / entry, targets,
          stopProb: touchProb(entry, stop, sigma, H),
          anchor: anchor.price,
        };
      }
    }

    let signal = 'WAIT';
    if (plan) {
      const okRR = plan.targets[0].rr >= 1.0 && plan.targets[1].rr >= 1.8;
      if (!okRR) warns.push('نسبة العائد/المخاطرة ضعيفة بسبب مقاومة قريبة');
      if (score >= 60 && okRR && trendUp && plan.riskPct <= 0.08) signal = 'BUY';
      if (plan.riskPct > 0.08) warns.push('الوقف بعيد (أكثر من 8%)');
    }
    if (!trendUp && inflow.score < 40 && inflow.buyRatio < 0.5) signal = 'AVOID';

    // خروج: إغلاق تحت دعم قوي كُسر للتو بحجم وضغط بيع، أو تحت EMA50 مع انقلاب السيولة
    const broke = levels.find((l) => l.strength >= 3 && closes[n - 2] >= l.price && closes[n - 1] < l.price - 0.3 * A);
    const lostEma = closes[n - 2] >= e50[n - 2] && price < e50[n - 1] - 0.3 * A;
    if ((broke && inflow.buyRatio < 0.5 && inflow.relVol >= 1.2) || (lostEma && inflow.buyRatio < 0.48 && inflow.cvdUp === false)) {
      signal = 'EXIT';
      warns.push(broke ? `كسر دعم ${fmt(broke.price)} بإغلاق وضغط بيع` : 'كسر EMA50 مع انقلاب السيولة للبيع');
    }

    return {
      price, atr: A, atrPct: A / price, rsi: rsiV, ema50: e50[n - 1], ema200: e200 ? e200[n - 1] : null,
      sigma, horizon: H, vp, levels, inflow, mode, score: Math.min(100, score), signal, plan, reasons, warns,
      t: last.t,
    };
  }

  function fmt(p) {
    if (!isFinite(p)) return '-';
    if (p >= 1000) return p.toFixed(2);
    if (p >= 1) return p.toFixed(4);
    if (p >= 0.01) return p.toFixed(5);
    return p.toPrecision(4);
  }

  /* ---------- باك تست ---------- */
  // يمر على التاريخ شمعة بشمعة، يولّد الإشارة بالبيانات المتاحة وقتها فقط، ثم يحاكي الصفقة.
  // الوقف يُفحص قبل الهدف في نفس الشمعة (افتراض متحفظ). الخروج الكامل عند TP1 أو TP2 حسب الخيار.
  function backtest(cs, o = {}) {
    const fee = o.fee ?? 0.001, maxHold = o.maxHold || 48, useTp = o.tp === 3 ? 2 : (o.tp === 2 ? 1 : 0);
    const trades = [];
    let i = 210;
    while (i < cs.length - 2) {
      const a = analyze(cs.slice(0, i + 1), { vpLen: 200 });
      if (a && a.signal === 'BUY' && a.plan) {
        const { entry, stop, risk } = a.plan;
        const tp = a.plan.targets[useTp].price;
        let exit = null, j = i + 1;
        for (; j < cs.length && j <= i + maxHold; j++) {
          if (cs[j].l <= stop) { exit = stop; break; }
          if (cs[j].h >= tp) { exit = tp; break; }
        }
        if (exit === null) { j = Math.min(i + maxHold, cs.length - 1); exit = cs[j].c; }
        const R = (exit - entry) / risk - (fee * 2 * entry) / risk;
        trades.push({ i, t: cs[i].t, entry, exit, R, bars: j - i, mode: a.mode });
        i = j + 1;
      } else i++;
    }
    const wins = trades.filter((t) => t.R > 0);
    let eq = 0, peak = 0, dd = 0;
    trades.forEach((t) => { eq += t.R; peak = Math.max(peak, eq); dd = Math.max(dd, peak - eq); });
    return {
      count: trades.length, winRate: trades.length ? wins.length / trades.length : 0,
      avgR: trades.length ? mean(trades.map((t) => t.R)) : 0, totalR: eq, maxDD: dd, trades,
    };
  }

  return { parseKlines, ema, rsi, atr, volumeProfile, swingPoints, buildLevels, liquidityInflow, analyze, backtest, touchProb, normCdf, fmt, logReturnStd };
});

</script>
<script>
/* واجهة التطبيق: جلب بيانات بينانس العامة (بدون مفاتيح) + عرض النتائج + الرسم */
(function () {
  'use strict';
  const BASES = ['https://api.binance.com', 'https://data-api.binance.vision'];
  const STABLE = new Set(['USDC', 'FDUSD', 'TUSD', 'USDP', 'DAI', 'BUSD', 'USDE', 'EUR', 'EURI', 'AEUR', 'GBP', 'TRY', 'BRL', 'USD1', 'XUSD', 'PAXG']);
  const $ = (id) => document.getElementById(id);
  const fmt = Analysis.fmt;
  const LBL = { BUY: 'شراء', WAIT: 'انتظار', AVOID: 'تجنب', EXIT: 'خروج' };
  let rows = [], prevState = {}, firstScan = true, ws1 = null, ws2 = null, sortKey = 'flow', sortDir = -1, selected = null, timer = null;

  async function api(path) {
    let err;
    for (const b of BASES) {
      try {
        const r = await fetch(b + path);
        if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 120));
        return await r.json();
      } catch (e) { err = e; }
    }
    throw err;
  }

  async function getKlines(symbol, tf, limit) {
    const raw = await api(`/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=${limit}`);
    return Analysis.parseKlines(raw.slice(0, -1)); // نحذف الشمعة المفتوحة: التحليل على الشموع المغلقة فقط
  }

  async function pool(items, size, fn) {
    let i = 0;
    await Promise.all(Array.from({ length: size }, async () => {
      while (i < items.length) { const k = i++; await fn(items[k], k); }
    }));
  }

  async function scan() {
    const btn = $('scan'); btn.disabled = true;
    const tf = $('tf').value, minVol = +$('minVol').value * 1e6, topN = +$('topN').value;
    try {
      setStatus('جلب قائمة العملات...');
      const tickers = await api('/api/v3/ticker/24hr');
      const list = tickers.filter((t) => {
        if (!t.symbol.endsWith('USDT')) return false;
        const base = t.symbol.slice(0, -4);
        if (STABLE.has(base) || /(UP|DOWN|BULL|BEAR)$/.test(base)) return false;
        return +t.quoteVolume >= minVol;
      }).sort((a, b) => +b.quoteVolume - +a.quoteVolume).slice(0, topN);
      rows = [];
      let done = 0;
      await pool(list, 6, async (t) => {
        try {
          const cs = await getKlines(t.symbol, tf, 300);
          const a = Analysis.analyze(cs);
          if (a) rows.push({ symbol: t.symbol, price: a.price, chg: +t.priceChangePercent, a, cs,
            flow: a.inflow.score, relVol: a.inflow.relVol, buy: a.inflow.buyRatio, signal: a.signal, score: a.score });
        } catch (e) { /* نتجاهل عملة فشل جلبها */ }
        setStatus(`تحليل ${++done}/${list.length}...`);
        if (done % 10 === 0) render();
      });
      render();
      checkAlerts();
      startLive(tf);
      setStatus(`تم تحليل ${rows.length} عملة — ${new Date().toLocaleTimeString('ar')} — الشموع المغلقة فقط.`);
      if (selected) { const r = rows.find((x) => x.symbol === selected); if (r) showDetail(r); }
    } catch (e) {
      setStatus('تعذر الاتصال ببينانس: ' + e.message + ' — تأكد من الإنترنت ومن أن بينانس غير محجوبة في بلدك (جرّب VPN).');
    } finally { btn.disabled = false; }
  }

  function setStatus(s) { $('status').textContent = s; }
  const pct = (x, d = 2) => (x * 100).toFixed(d) + '%';

  function render() {
    const order = { BUY: 4, WAIT: 3, AVOID: 2, EXIT: 1 };
    const sorted = [...rows].sort((x, y) => {
      const a = sortKey === 'signal' ? order[x.signal] : x[sortKey], b = sortKey === 'signal' ? order[y.signal] : y[sortKey];
      return (a > b ? 1 : a < b ? -1 : 0) * sortDir;
    });
    const tb = $('tbl').tBodies[0]; tb.innerHTML = '';
    for (const r of sorted) {
      const tr = document.createElement('tr');
      tr.className = 'row' + (r.symbol === selected ? ' sel' : '');
      tr.innerHTML = `<td><b>${r.symbol.replace('USDT', '')}</b><span class="mut">/USDT</span></td><td>${fmt(r.price)}</td>
        <td class="${r.chg >= 0 ? 'up' : 'dn'}">${r.chg.toFixed(2)}%</td>
        <td><span class="bar" style="width:${r.flow * 0.5}px"></span> ${r.flow} <span class="mut">${r.a.inflow.label}</span></td>
        <td>${r.relVol.toFixed(1)}x</td><td class="${r.buy >= 0.5 ? 'up' : 'dn'}">${(r.buy * 100).toFixed(0)}%</td>
        <td><span class="tag ${r.signal}">${LBL[r.signal]}</span></td><td>${r.score}</td>`;
      tr.onclick = () => { selected = r.symbol; render(); showDetail(r); };
      tb.appendChild(tr);
    }
  }

  function showDetail(r) {
    const a = r.a, p = a.plan, vp = a.vp;
    const money = (x) => (Math.abs(x) >= 1e6 ? (x / 1e6).toFixed(2) + 'M' : (x / 1e3).toFixed(0) + 'K') + '$';
    let planHtml = '<div class="mut">لا توجد خطة دخول الآن (لا ارتداد مؤكد من دعم ولا اختراق بحجم).</div>';
    if (p) {
      planHtml = `<div class="grid">
        <div class="kv"><span>الدخول (${a.mode === 'bounce' ? 'ارتداد' : 'اختراق'})</span><b>${fmt(p.entry)}</b></div>
        <div class="kv"><span>وقف الخسارة</span><b class="dn">${fmt(p.stop)}</b><span>-${pct(p.riskPct)} · احتمال لمسه ${pct(p.stopProb, 0)}</span></div>
        ${p.targets.map((t, i) => `<div class="kv"><span>هدف ${i + 1} · ${t.kind}</span><b class="up">${fmt(t.price)}</b>
          <span>+${pct(t.pct)} · ${t.rr.toFixed(1)}R · احتمال ${pct(t.prob, 0)}</span></div>`).join('')}</div>`;
    }
    $('detail').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h2 style="margin:0">${r.symbol} <span class="live" id="lp"></span> <span class="tag ${a.signal}">${LBL[a.signal]}</span> <span class="mut">${a.score}/100</span></h2>
        <button id="bt">باك تست على آخر 1000 شمعة</button></div>
      <canvas id="cv"></canvas>
      ${planHtml}
      <div class="grid">
        <div class="kv"><span>POC (أكثر سعر تداولاً)</span><b>${fmt(vp.poc)}</b></div>
        <div class="kv"><span>VAH / VAL (منطقة القيمة 70%)</span><b>${fmt(vp.vah)} / ${fmt(vp.val)}</b></div>
        <div class="kv"><span>RSI · ATR</span><b>${a.rsi.toFixed(0)} · ${pct(a.atrPct)}</b></div>
        <div class="kv"><span>صافي شراء Taker (6 شموع)</span><b class="${a.inflow.netInflow >= 0 ? 'up' : 'dn'}">${a.inflow.netInflow >= 0 ? '+' : '-'}${money(a.inflow.netInflow)}</b></div>
      </div>
      <b>أسباب الإشارة</b><ul>${a.reasons.map((x) => `<li>${x}</li>`).join('') || '<li class="mut">—</li>'}</ul>
      ${a.warns.length ? `<b>تنبيهات</b><ul class="warn">${a.warns.map((x) => `<li>${x}</li>`).join('')}</ul>` : ''}
      <div id="btres"></div>
      <div class="note">احتمال اللمس = تقدير إحصائي (سير عشوائي بتذبذب آخر 100 شمعة، أفق ${a.horizon} شمعة) وليس وعداً.
      الأهداف مبنية على مقاومات وفوليوم بروفايل فعلية، وعند غيابها تُستكمل بمضاعفات المخاطرة (R). هذا أداة تحليل وليس نصيحة مالية؛ لا توجد استراتيجية تضمن الربح.</div>`;
    drawChart($('cv'), r.cs, a);
    updateLive(r);
    startKline(r);
    $('bt').onclick = () => runBacktest(r);
  }

  async function runBacktest(r) {
    const el = $('btres'); $('bt').disabled = true; el.innerHTML = '<div class="mut">جلب البيانات وتشغيل الباك تست...</div>';
    try {
      const cs = await getKlines(r.symbol, $('tf').value, 1000);
      await new Promise((res) => setTimeout(res, 30));
      const b = Analysis.backtest(cs, { tp: 2 });
      el.innerHTML = `<b>باك تست ${r.symbol} (${cs.length} شمعة، خروج عند الهدف 2 أو الوقف، عمولة 0.1% بكل اتجاه)</b>
        <div class="grid"><div class="kv"><span>الصفقات</span><b>${b.count}</b></div>
        <div class="kv"><span>نسبة النجاح</span><b>${pct(b.winRate, 0)}</b></div>
        <div class="kv"><span>متوسط الصفقة</span><b class="${b.avgR >= 0 ? 'up' : 'dn'}">${b.avgR.toFixed(2)}R</b></div>
        <div class="kv"><span>المجموع / أقصى تراجع</span><b>${b.totalR.toFixed(1)}R / ${b.maxDD.toFixed(1)}R</b></div></div>
        <div class="mut">${b.count < 20 ? 'عدد الصفقات قليل — النتيجة غير موثوقة إحصائياً. ' : ''}الأداء السابق لا يضمن المستقبل.</div>`;
    } catch (e) { el.innerHTML = '<div class="dn">فشل: ' + e.message + '</div>'; }
    $('bt').disabled = false;
  }

  /* ---------- الرسم ---------- */
  function drawChart(cv, all, a) {
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext('2d'); g.scale(dpr, dpr);
    const N = Math.min(110, all.length), cs = all.slice(-N);
    const padR = 64, vpW = Math.min(110, W * 0.22), plotW = W - padR - vpW, top = 8, bot = H - 8;
    const p = a.plan;
    let hi = Math.max(...cs.map((c) => c.h)), lo = Math.min(...cs.map((c) => c.l));
    if (p) { hi = Math.max(hi, p.targets[0].price); lo = Math.min(lo, p.stop); }
    const m = (hi - lo) * 0.05; hi += m; lo -= m;
    const y = (v) => top + (hi - v) / (hi - lo) * (bot - top);
    const x = (i) => vpW + (i + 0.5) * (plotW / N);
    const cw = Math.max(1, plotW / N * 0.65);

    // فوليوم بروفايل أفقي على اليسار
    const vp = a.vp;
    for (let i = 0; i < vp.bins; i++) {
      const pl = vp.lo + i * vp.step, ph = pl + vp.step;
      if (ph < lo || pl > hi) continue;
      const inVA = pl >= vp.val - 1e-9 && ph <= vp.vah + 1e-9;
      g.fillStyle = i === Math.round((vp.poc - vp.lo) / vp.step - 0.5) ? 'rgba(240,185,11,.75)' : inVA ? 'rgba(100,140,255,.35)' : 'rgba(132,142,156,.25)';
      const w = vp.vol[i] / vp.maxVol * (vpW - 6);
      g.fillRect(0, y(ph), w, Math.max(1, y(pl) - y(ph) - 1));
    }
    // خطوط الدعم/المقاومة
    g.font = '11px sans-serif'; g.textAlign = 'right';
    for (const l of a.levels) {
      if (l.price < lo || l.price > hi || l.strength < 2) continue;
      g.strokeStyle = l.price > a.price ? 'rgba(246,70,93,.35)' : 'rgba(14,203,129,.35)';
      g.lineWidth = Math.min(3, 0.6 + l.strength * 0.3); g.setLineDash([2, 4]);
      g.beginPath(); g.moveTo(vpW, y(l.price)); g.lineTo(vpW + plotW, y(l.price)); g.stroke();
    }
    g.setLineDash([]);
    // الشموع
    cs.forEach((c, i) => {
      const up = c.c >= c.o; g.strokeStyle = g.fillStyle = up ? '#0ecb81' : '#f6465d'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x(i), y(c.h)); g.lineTo(x(i), y(c.l)); g.stroke();
      g.fillRect(x(i) - cw / 2, y(Math.max(c.o, c.c)), cw, Math.max(1, Math.abs(y(c.o) - y(c.c))));
    });
    // الدخول/الوقف/الأهداف
    const line = (v, color, label) => {
      g.strokeStyle = color; g.fillStyle = color; g.lineWidth = 1.2; g.setLineDash([6, 3]);
      g.beginPath(); g.moveTo(vpW, y(v)); g.lineTo(W - padR, y(v)); g.stroke(); g.setLineDash([]);
      g.textAlign = 'left'; g.fillText(label + ' ' + fmt(v), W - padR + 4, y(v) + 4);
    };
    if (p) {
      line(p.entry, '#eaecef', 'دخول'); line(p.stop, '#f6465d', 'وقف');
      p.targets.forEach((t, i) => line(t.price, '#0ecb81', 'هـ' + (i + 1)));
    } else line(a.price, '#848e9c', '');
    g.fillStyle = '#848e9c'; g.textAlign = 'left';
    g.fillText('POC', 2, y(vp.poc) - 3);
  }


  /* ---------- التنبيهات ---------- */
  function beep() {
    try {
      const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = 0.08;
      o.start(); o.stop(c.currentTime + 0.25);
    } catch (e) { /* بعض المتصفحات تمنع الصوت قبل أي نقر */ }
  }
  function notify(title, body) {
    const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<b>${title}</b><br>${body}`;
    $('toasts').appendChild(t); setTimeout(() => t.remove(), 12000);
    if (!$('alerts').checked) return;
    beep();
    try { if (window.Notification && Notification.permission === 'granted') new Notification(title, { body }); } catch (e) { /* ignore */ }
  }
  function checkAlerts() {
    for (const r of rows) {
      const prev = prevState[r.symbol] || {}, strong = r.a.inflow.label === 'دخول سيولة قوي';
      const name = r.symbol.replace('USDT', '');
      if (!firstScan) {
        if (r.signal === 'BUY' && prev.signal !== 'BUY') notify(`إشارة شراء ${name}`, `دخول ${fmt(r.a.plan.entry)} · وقف ${fmt(r.a.plan.stop)} · هدف1 ${fmt(r.a.plan.targets[0].price)}`);
        else if (r.signal === 'EXIT' && prev.signal === 'BUY') notify(`خروج ${name}`, 'انكسر الدعم أو انقلبت السيولة بعد إشارة شراء');
        if (strong && !prev.strong) notify(`دخول سيولة قوي ${name}`, `حجم ${r.relVol.toFixed(1)}x · شراء Taker ${(r.buy * 100).toFixed(0)}%`);
      }
      prevState[r.symbol] = { signal: r.signal, strong };
    }
    firstScan = false;
  }

  /* ---------- بيانات مباشرة (WebSocket) ---------- */
  function startLive(tf) {
    if (ws1) return;
    const open = () => {
      ws1 = new WebSocket('wss://stream.binance.com:9443/stream?streams=!miniTicker@arr');
      let last = 0;
      ws1.onmessage = (e) => {
        const arr = JSON.parse(e.data).data, now = Date.now(); if (!Array.isArray(arr)) return;
        const m = new Map(arr.map((x) => [x.s, x]));
        for (const r of rows) { const x = m.get(r.symbol); if (x) { r.price = +x.c; r.chg = (+x.c / +x.o - 1) * 100; } }
        if (now - last > 1500) { last = now; render(); const r = rows.find((x) => x.symbol === selected); if (r) updateLive(r); }
      };
      ws1.onclose = () => { ws1 = null; setTimeout(() => rows.length && startLive(tf), 3000); };
    };
    open();
  }
  function updateLive(r) {
    const el = $('lp'); if (!el) return;
    const p = r.a.plan; let txt = '● ' + fmt(r.price);
    if (p) {
      if (r.price <= p.stop) txt += ' — ضُرب الوقف';
      else { const hit = p.targets.filter((t) => r.price >= t.price).length; txt += hit ? ` — تحقق هدف ${hit}` : ` — ${((r.price / p.entry - 1) * 100).toFixed(2)}% عن الدخول`; }
    }
    el.textContent = txt;
  }
  // شمعة جديدة مغلقة للعملة المختارة → إعادة التحليل فوراً
  function startKline(r) {
    if (ws2) { ws2.onclose = null; ws2.close(); }
    const tf = $('tf').value;
    ws2 = new WebSocket(`wss://stream.binance.com:9443/ws/${r.symbol.toLowerCase()}@kline_${tf}`);
    ws2.onmessage = (e) => {
      const k = JSON.parse(e.data).k; if (!k || !k.x) return;
      const c = Analysis.parseKlines([[k.t, k.o, k.h, k.l, k.c, k.v, k.T, k.q, k.n, k.V, k.Q, 0]])[0];
      if (r.cs[r.cs.length - 1].t === c.t) return;
      r.cs.push(c); if (r.cs.length > 400) r.cs.shift();
      const a = Analysis.analyze(r.cs); if (!a) return;
      Object.assign(r, { a, flow: a.inflow.score, relVol: a.inflow.relVol, buy: a.inflow.buyRatio, signal: a.signal, score: a.score });
      checkAlerts(); render(); if (selected === r.symbol) showDetail(r);
    };
    ws2.onclose = () => { if (selected === r.symbol) setTimeout(() => selected === r.symbol && startKline(r), 3000); };
  }

  /* ---------- باك تست شامل ---------- */
  async function batchBacktest() {
    if (!rows.length) { setStatus('افحص السوق أولاً.'); return; }
    const btn = $('batch'); btn.disabled = true;
    const box = $('batchres'); box.style.display = 'block';
    const list = [...rows].sort((a, b) => b.flow - a.flow), out = [];
    let done = 0;
    await pool(list, 4, async (r) => {
      try {
        const cs = await getKlines(r.symbol, $('tf').value, 1000);
        await new Promise((res) => setTimeout(res, 0));
        const b = Analysis.backtest(cs, { tp: 2 });
        out.push({ r, b });
      } catch (e) { /* تجاهل */ }
      setStatus(`باك تست شامل ${++done}/${list.length}...`);
    });
    const ok = out.filter((x) => x.b.count >= 10).sort((x, y) => y.b.avgR - x.b.avgR);
    const few = out.filter((x) => x.b.count < 10);
    const row = ({ r, b }) => `<tr class="row" data-s="${r.symbol}"><td><b>${r.symbol.replace('USDT', '')}</b></td><td>${b.count}</td>
      <td>${pct(b.winRate, 0)}</td><td class="${b.avgR >= 0 ? 'up' : 'dn'}">${b.avgR.toFixed(2)}R</td><td>${b.totalR.toFixed(1)}R</td>
      <td>${b.maxDD.toFixed(1)}R</td><td><span class="tag ${r.signal}">${LBL[r.signal]}</span></td></tr>`;
    box.innerHTML = `<b>ترتيب العملات بالباك تست (${$('tf').value} · آخر 1000 شمعة · عمولة 0.1%)</b>
      <div class="mut">الترتيب بمتوسط R لكل صفقة. يُعتمد فقط ما فيه 10 صفقات أو أكثر. تحسين الإعدادات على نفس البيانات قد يعطي نتائج مضللة — الأداء السابق لا يضمن المستقبل.</div>
      <div class="tbl"><table><thead><tr><th>العملة</th><th>الصفقات</th><th>النجاح</th><th>متوسط R</th><th>المجموع</th><th>أقصى تراجع</th><th>الآن</th></tr></thead>
      <tbody>${ok.map(row).join('') || '<tr><td colspan="7" class="mut">لا توجد عملة بصفقات كافية.</td></tr>'}</tbody></table></div>
      ${few.length ? `<div class="mut">صفقات قليلة (غير موثوقة): ${few.map((x) => x.r.symbol.replace('USDT', '') + ' (' + x.b.count + ')').join('، ')}</div>` : ''}`;
    box.querySelectorAll('tr.row').forEach((tr) => tr.onclick = () => {
      const r = rows.find((x) => x.symbol === tr.dataset.s); if (r) { selected = r.symbol; render(); showDetail(r); window.scrollTo(0, 0); }
    });
    setStatus(`اكتمل الباك تست الشامل لـ ${out.length} عملة.`);
    btn.disabled = false;
  }

  /* ---------- أحداث ---------- */
  $('scan').onclick = scan;
  $('batch').onclick = batchBacktest;
  $('alerts').onchange = (e) => { if (e.target.checked && window.Notification && Notification.permission === 'default') Notification.requestPermission(); beep(); };
  $('tf').onchange = () => { rows = []; prevState = {}; firstScan = true; selected = null; render(); setStatus('تغيّر الإطار الزمني — اضغط «فحص السوق».'); };
  $('tbl').tHead.onclick = (e) => {
    const k = e.target.dataset && e.target.dataset.k; if (!k) return;
    sortDir = k === sortKey ? -sortDir : -1; sortKey = k; render();
  };
  $('auto').onchange = (e) => {
    clearInterval(timer);
    if (e.target.checked) timer = setInterval(scan, 5 * 60 * 1000);
  };
  window.addEventListener('resize', () => { const r = rows.find((x) => x.symbol === selected); if (r && $('cv')) drawChart($('cv'), r.cs, r.a); });
})();

</script>
</body>
</html>
