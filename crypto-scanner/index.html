<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماسح بينانس</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0e11">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ماسح بينانس">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#0b0e11;--panel:#161a1e;--line:#2b3139;--tx:#eaecef;--mut:#848e9c;--up:#0ecb81;--dn:#f6465d;--acc:#f0b90b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:17px;margin:0 6px 0 0;color:var(--acc)}
select,input,button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}button.pri{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
button:disabled{opacity:.5;cursor:wait}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:12px}
@media(min-width:1000px){main{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
#status{color:var(--mut);font-size:12px;padding:0 14px}
.tbl{overflow:auto;max-height:78vh}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--mut);position:sticky;top:0;background:var(--panel);font-weight:500;cursor:pointer}
tr.row{cursor:pointer}tr.row:hover,tr.sel{background:#1f252b}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700}
.BUY{background:rgba(14,203,129,.18);color:var(--up)}.WAIT{background:rgba(240,185,11,.15);color:var(--acc)}.AVOID{background:rgba(246,70,93,.18);color:var(--dn)}.EXIT{background:var(--dn);color:#fff}
#toasts{position:fixed;bottom:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:20;max-width:320px}.toast{background:var(--panel);border:1px solid var(--acc);border-radius:8px;padding:8px 12px;box-shadow:0 4px 16px #000a}.live{color:var(--up);font-size:12px}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--acc);vertical-align:middle}
canvas{width:100%;height:380px;display:block;background:#0b0e11;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.kv{background:#0b0e11;border-radius:6px;padding:8px}.kv b{display:block;font-size:15px}.kv span{color:var(--mut);font-size:12px}
ul{margin:6px 0;padding-inline-start:20px}li{margin:2px 0}
.warn li{color:var(--acc)}
.note{color:var(--mut);font-size:12px;border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
</style>
</head>
<body>
<header>
  <h1>ماسح بينانس</h1>
  <select id="tf">
    <option value="15m">15 دقيقة</option><option value="1h" selected>ساعة</option>
    <option value="4h">4 ساعات</option><option value="1d">يومي</option>
  </select>
  <label class="mut">أدنى حجم 24س (مليون$)
    <input id="minVol" type="number" value="10" min="0" style="width:70px"></label>
  <label class="mut">عدد العملات
    <input id="topN" type="number" value="60" min="10" max="150" style="width:64px"></label>
  <button id="scan" class="pri">فحص السوق</button>
  <button id="batch">باك تست شامل</button>
  <label class="mut"><input id="auto" type="checkbox"> تحديث تلقائي (5 د)</label>
  <label class="mut"><input id="alerts" type="checkbox"> تنبيهات</label>
</header>
<div id="status">اضغط «فحص السوق» لجلب أعلى العملات سيولة من بينانس.</div>
<main>
  <section class="card">
    <div class="tbl"><table id="tbl"><thead><tr>
      <th data-k="symbol">العملة</th><th data-k="price">السعر</th><th data-k="chg">24س</th>
      <th data-k="flow">السيولة</th><th data-k="relVol">حجم نسبي</th><th data-k="buy">شراء Taker</th>
      <th data-k="signal">الإشارة</th><th data-k="score">النقاط</th></tr></thead><tbody></tbody></table></div>
  </section>
  <section class="card" id="detail"><div class="mut">اختر عملة من الجدول لعرض الخطة والرسم.</div></section>
</main>
<section id="batchres" class="card" style="margin:0 12px 12px;display:none"></section>
<div id="toasts"></div>
<script src="analysis.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
