<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماسح بينانس</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0e11">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ماسح بينانس">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#0b0e11;--panel:#161a1e;--panel2:#1e2329;--line:#2b3139;--tx:#eaecef;--mut:#848e9c;--up:#0ecb81;--dn:#f6465d;--acc:#f0b90b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:40px}
select,input,button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit}
button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}
button.pri{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
button.go{background:var(--up);color:#000;border-color:var(--up);font-weight:700}
button.bad{background:var(--dn);color:#fff;border-color:var(--dn);font-weight:700}
header{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:6}
.row1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:18px;margin:0 0 0 6px;color:var(--acc)}
.sets{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px;color:var(--mut);font-size:13px}
.sets input{width:84px;padding:5px 8px}
details{margin-top:6px;color:var(--mut);font-size:13px}details input{width:70px;padding:4px 8px}
#status{color:var(--mut);font-size:12px;padding:6px 14px}
nav{display:flex;gap:4px;padding:8px 10px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;border-radius:20px;color:var(--mut)}
nav button.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
nav b{margin-inline-start:4px}
#view{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px;align-items:start}
#view>.full{grid-column:1/-1}
.cd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.cd.buy{border-color:var(--up)}.cd.ex{border-color:var(--dn)}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.hd .nm{font-size:18px;font-weight:700}
.tag{padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.BUY{background:var(--up);color:#000}.WAIT{background:rgba(240,185,11,.18);color:var(--acc)}.AVOID{background:rgba(246,70,93,.18);color:var(--dn)}.EXIT{background:var(--dn);color:#fff}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.acc{color:var(--acc)}
.steps{margin:10px 0;display:flex;flex-direction:column;gap:6px}
.st{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border-radius:8px;padding:7px 9px}
.st i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--acc);font-style:normal;font-size:12px;display:grid;place-items:center;font-weight:700}
.st.done{opacity:.55;text-decoration:line-through}
.sz{background:var(--bg);border-radius:8px;padding:8px;margin:8px 0;font-size:13px}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.box{border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:700;font-size:16px}
.box.HOLD{background:rgba(14,203,129,.12);color:var(--up)}
.box.SELL_PART{background:var(--acc);color:#000}
.box.EXIT{background:var(--dn);color:#fff}
ul{margin:4px 0;padding-inline-start:20px}li{margin:2px 0}
.warn li{color:var(--acc)}
.sm{font-size:12px}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin:8px 0}
.kv{background:var(--bg);border-radius:8px;padding:6px 8px}.kv b{display:block}.kv span{color:var(--mut);font-size:12px}
.tbl{overflow:auto;max-height:75vh}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--mut);position:sticky;top:0;background:var(--panel);font-weight:500;cursor:pointer}
tr.r{cursor:pointer}tr.r:hover{background:var(--panel2)}
.empty{color:var(--mut);padding:24px 8px;text-align:center}
.note{color:var(--mut);font-size:12px;border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
#ov{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding:12px;display:none}
#ov.on{display:block}
canvas{width:100%;height:380px;display:block;background:#0b0e11;border-radius:8px}
#toasts{position:fixed;bottom:12px;left:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:40;max-width:420px}
.toast{background:var(--panel);border:1px solid var(--acc);border-radius:10px;padding:10px 12px;box-shadow:0 4px 16px #000a}
</style>
</head>
<body>
<header>
  <div class="row1">
    <h1>ماسح بينانس</h1>
    <select id="tf" aria-label="الإطار الزمني">
      <option value="15m">15 دقيقة</option><option value="1h" selected>ساعة</option>
      <option value="4h">4 ساعات</option><option value="1d">يومي</option>
    </select>
    <button id="scan" class="pri">فحص السوق</button>
    <label class="mut sm"><input id="alerts" type="checkbox"> تنبيهات</label>
    <label class="mut sm"><input id="auto" type="checkbox"> تحديث كل 5 د</label>
  </div>
  <div class="sets">
    <label>رأس المال $ <input id="capital" type="number" min="10" value="1000"></label>
    <label>المخاطرة لكل صفقة % <input id="risk" type="number" min="0.1" max="5" step="0.1" value="1"></label>
  </div>
  <details><summary>إعدادات الفحص</summary>
    <label>أدنى حجم 24س (مليون$) <input id="minVol" type="number" value="10" min="0"></label>
    <label>عدد العملات <input id="topN" type="number" value="60" min="10" max="150"></label>
  </details>
</header>
<div id="status">اضغط «فحص السوق» لجلب أعلى العملات سيولة من بينانس.</div>
<nav id="tabs">
  <button data-t="enter" class="on">ادخل الآن<b id="n-enter">0</b></button>
  <button data-t="watch">راقب<b id="n-watch">0</b></button>
  <button data-t="trades">صفقاتي<b id="n-trades">0</b></button>
  <button data-t="all">كل العملات</button>
  <button data-t="bt">باك تست</button>
</nav>
<main id="view"></main>
<div id="ov"></div>
<div id="toasts"></div>
<script src="analysis.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
